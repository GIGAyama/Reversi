name: CI

# ⚠️ push だけでなく pull_request でも動かす。
#    push: branches: [main] だけだと、PR の時点で落ちていることに気づけず、
#    マージしてから main が赤くなる。
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # 手元で走らせる npm run check と同じもの。
      # CI だけが知っている検査を作らない。
      - name: 品質ゲート（lint / test / build / check-project）
        run: npm run check

      # 「0件でした」だけでは、検査が動いているのか
      # 何も見ていないのか区別できない。わざと壊して気づくことまで確かめる。
      - name: 品質ゲート自体の確認（わざと壊す）
        run: npm run verify-gate

  # 正本（GIGAyama.github.io/standards/）との一致。コピーだけ直すと他リポジトリに修正が届かないため。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GIGAyama/GIGAyama.github.io
          path: .standards-src
      - name: 正本とのずれ検知
        run: node .standards-src/standards/check-drift.mjs --standards .standards-src/standards
